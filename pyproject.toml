[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "interview-local"
version = "0.2.0"
description = "Local German interview transcription with two speakers"
requires-python = ">=3.11,<3.13"
dependencies = ["onnxruntime>=1.20,<2", "psutil>=6,<8", "av>=14,<19", "soundfile>=0.13,<1", "numpy>=2,<3", "faster-whisper>=1.2,<2", "pyannote.audio>=4,<5", "whisperx>=3.7,<3.9", "torch>=2.8,<2.9", "torchcodec>=0.7,<0.8", "torchaudio>=2.8,<2.9", "transformers>=4.48,<5", "huggingface-hub>=0.34,<1"]
[project.scripts]
interview-local = "interview_local.cli:main"
[tool.setuptools.packages.find]
include = ["interview_local*"]
[tool.setuptools.package-data]
"interview_local.web" = ["static/*"]

[tool.mutmut]
source_paths = ["interview_local/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Message wording shown to people: error messages, fixed-text and status prints, prompts, CLI help.
# The text is presentation, not contract; tests assert the outcome (status, exception type, state).
do_not_mutate_patterns = [
    'raise \w+\((HTTPStatus\.\w+,\s*)?(f?"|[A-Z_]+\)|$)',
    'return \w*Error\(f?"',
    '\bprint\(f?"(?!.*file=sys\.stderr)',
    '\bstatus\(f?"',
    '\binput\("',
    '\b(help|description)="',
    # Equivalent by specification: HTTP field names are case-insensitive (RFC 9110 5.1), so are codec names.
    '(send_header|headers\.get)\("[A-Z][A-Za-z-]*"',
    '\.(en|de)code\("utf-8"\)',
]

[tool.pytest.ini_options]
addopts = "--ignore=mutants"
