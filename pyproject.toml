[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "interview-local"
version = "0.2.0"
description = "Local German interview transcription with two speakers"
requires-python = ">=3.11,<3.13"
dependencies = ["onnxruntime>=1.20,<2", "psutil>=6,<8", "av>=14,<19", "soundfile>=0.13,<1", "numpy>=2,<3", "faster-whisper>=1.2,<2", "pyannote.audio>=4,<5", "whisperx>=3.7,<3.9", "torch>=2.8,<2.9", "torchcodec>=0.7,<0.8", "torchaudio>=2.8,<2.9", "transformers>=4.48,<5", "huggingface-hub>=0.34,<1"]
[project.scripts]
interview-local = "interview_local.cli:main"
[tool.setuptools.packages.find]
include = ["interview_local*"]

[tool.ruff]
# Untracked agent worktrees of other branches live here.
extend-exclude = [".claude"]

[tool.mutmut]
source_paths = ["interview_local/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Run ad hoc, outside the project environment:
#   uv run --no-sync --with mutmut --with pytest mutmut run "<glob>"
# Each pattern silences one class of mutants that cannot change a result: prose
# shown to a person, or spellings the called library treats as identical.
do_not_mutate_patterns = [
    # Codec names are case-insensitive, so "UTF-8" reads and writes as "utf-8".
    '"utf-8"',
    # json reads ensure_ascii only for truthiness, so None behaves as False.
    'ensure_ascii=False',
    # A line holding nothing but a prose message fragment.
    '^\s*f?"[^"{}]* [^"{}]*"( \+ str\(exc\))?\s*\)?,?\s*$',
    '^\s*\+ f?"[^"{}]* [^"{}]*"\s*$',
    # argparse help and description texts.
    '\b(help|description)="',
    # Terminal prompts.
    'input\(f?"',
    '^\s*prompt = f?"',
    'getpass\.getpass\(',
    # Exception messages written on the raise line.
    'raise \w+\(f?"[^"]*"\)\s*$',
    # Console notices and when they are flushed.
    '^\s*print\(f?"',
    '^\s*flush=True,?\s*$',
    # Progress notices.
    'status\(f?"',
    # Tk window titles, labels, fonts, padding and layout.
    '\.pack\(|font=|padding=|\btitle=|\.title\(|\btext="|filetypes=|\.geometry\(|messagebox\.show|^\s*value="|status\.set\("',
    'ttk\.(Frame|Notebook)\(|^\s*frame,\s*$|^\s*anchor="',
]

[tool.pytest.ini_options]
addopts = "--ignore=mutants"
